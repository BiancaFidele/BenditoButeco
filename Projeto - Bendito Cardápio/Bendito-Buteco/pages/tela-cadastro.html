<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tela de Cadastro</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
        <style>
            @font-face {
                font-family: 'Montserrat';
                src: url(../assets/fonts/Montserrat-SemiBold.ttf);
            }
            body {
                background: url('../assets/img/Background.jpg') no-repeat center center fixed;
                -webkit-background-size: cover;
                -moz-background-size: cover;
                -o-background-size: cover;
                background-size: cover;
                margin: 0;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }
            #cde {color: #ffffff;}
            .logo {
                width: 140px;
                height: auto;
                display: block;
                margin-left: auto;
                margin-right: auto;
            }
            .home {
                display: block;
                margin-left: auto;
                margin-right: auto;
            }
            .center-text {
                text-align: center;
                font-family: 'Montserrat';
            }
            .center-button {
                display: flex;
                justify-content: center;
                font-family: 'Montserrat';
            }
        </style>
    </head>
    <body>
        <div id="app">
            <header>
                <img src="../assets/img/Logo.png" class="img-fluid logo" alt="Logotipo">
            </header>
            <main class="container">
                <div class="row mt-3 justify-content-center">
                    <div class="col-md-6">
                        <p class="lead center-text" id="cde">Contato</p>
                        <input type="text" class="form-control mb-3" placeholder="Nome Completo" v-model="nome">
                        <input type="number" class="form-control mb-3" placeholder="Telefone/WhatsApp" v-model="telefone">
                        <p class="lead center-text" id="cde">Endereço</p>
                        <input type="text" class="form-control mb-3" placeholder="Rua" v-model="rua">
                        <input type="number" class="form-control mb-3" placeholder="Número" v-model="nCasa">
                        <input type="text" class="form-control mb-3" placeholder="Bairro" v-model="bairro">
                        <input type="number" class="form-control mb-3" placeholder="CEP" v-model="cep">
                        <input type="text" class="form-control mb-3" placeholder="Complemento" v-model="complemento">
                        <div v-if="nome !='' && telefone !='' && bairro !='' && rua !='' && cep !='' && complemento !='' && nCasa !=''" class="center-button">
                            <button class="btn btn-outline-warning" @click="salvar">Salvar</button>
                        </div>
                        <div v-else class="center-button">
                            <button class="btn btn-outline-warning" disabled="salvar">Salvar</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <script>
            class Produto {
                constructor(nome, telefone, rua, nCasa, bairro, cep, complemento) {
                    this.nome = nome;
                    this.telefone = telefone;
                    this.rua = rua;
                    this.nCasa = nCasa;
                    this.bairro = bairro;
                    this.cep = cep;
                    this.complemento = complemento
                }
            }
            var app = new Vue({
                el: '#app',
                data() {
                    return {
                        nome: '',
                        telefone: '',
                        rua: '',
                        nCasa: '',
                        bairro: '',
                        cep: '',
                        complemento: '',
                        cdClientes: []
                    };
                },
                methods: {
                    salvar: function () {
                        this.cdClientes.push(new Produto(this.nome, this.telefone,  this.rua, this.nCasa, this.bairro, this.cep, this.complemento ));
                        this.nome = '',
                        this.telefone = '',
                        this.rua = '',
                        this.nCasa = '',
                        this.bairro = '',
                        this.cep = '',
                        this.complemento = ''
                        window.location.href = 'tela-inicial.html';
                    }
                }
            });
        </script>
        <footer>  
        </footer>
    </body>
</html>
