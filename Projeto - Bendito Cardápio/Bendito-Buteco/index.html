<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bendito Buteco</title>
    <style>
        @font-face {
            font-family: 'Montserrat';
            src: url('assets/fonts/Montserrat-SemiBold.ttf');
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: url('assets/img/Background.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
        }

        .logo {
            display: block;
            margin: 0 auto 24px;
            max-width: 220px;
            height: auto;
        }

        .button-link {
            display: inline-block;
            padding: 12px 24px;
            border: 2px solid #fece26;
            border-radius: 8px;
            color: #fece26;
            text-decoration: none;
            background-color: rgba(0, 0, 0, 0.45);
        }
    </style>
</head>
<body>
    <header>
        <img class="logo" src="assets/img/Logo.png" alt="Bendito Boteco" />
    </header>
    <main>
        <a class="button-link" href="pages/tela-inicial.html">Acessar o cardápio</a>
    </main>

</html>
